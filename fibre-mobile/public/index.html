<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Fiber360</title>

    <!-- react-native-web reset (the default Expo single-page shell) -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      The app is a phone UI. In a desktop browser it used to stretch to the
      whole window, so every field and card became 1200 px wide and the layout
      no longer looked like what an engineer sees on a handset. On wide screens
      it now sits in a centred, phone-width column; below 520 px it stays
      edge-to-edge, exactly as it renders on a device.

      This lives here, not in app/+html.tsx: this project exports with the
      default `web.output: "single"`, and +html.tsx is only used for static
      rendering. `public/index.html` is the supported template for single-page
      output.
    -->
    <style id="phone-frame">
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #e7ecf3;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        background: #f7f9fc;
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.06),
          0 20px 60px rgba(15, 23, 42, 0.14);
      }
      @media (max-width: 520px) {
        body {
          background: #f7f9fc;
        }
        #root {
          max-width: none;
          box-shadow: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
